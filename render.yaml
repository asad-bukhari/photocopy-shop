services:
  # Backend Web Service
  - type: web
    name: photocopy-shop-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8069
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: photocopy-shop-db
          property: connectionString
      - key: JWT_SECRET
        generate: true
        length: 32
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_ORIGIN
        value: https://photocopy-shop-frontend.onrender.com

  # Frontend Web Service
  - type: web
    name: photocopy-shop-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        value: https://photocopy-shop-backend.onrender.com

  # PostgreSQL Database
  - type: pserv
    name: photocopy-shop-db
    databaseName: photocopy_shop
    user: photocopy_user
    plan: free
    region: oregon
    maxConnections: 10
    ipAllowList: [] # Allow all connections (can be restricted)
