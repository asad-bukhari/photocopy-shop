<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Photocopy Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary btn-sm">← Back</button>
            <h1 class="navbar-brand">Customers & Credit</h1>
            <div></div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Customers</h2>
        </div>

        <div class="search-section">
            <input type="text" id="customerSearch" class="form-control" placeholder="Search customers...">
        </div>

        <div class="customer-list" id="customerList">
            <!-- Customers will be loaded here -->
        </div>

        <div class="floating-action">
            <button id="addCustomerBtn" class="btn btn-primary btn-large">+ Add Customer</button>
        </div>
    </div>

    <!-- Add Customer Modal -->
    <div id="addCustomerModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Customer</h3>
                <span class="close">&times;</span>
            </div>
            <form id="addCustomerForm">
                <div class="form-group">
                    <label for="customerName">Name *</label>
                    <input type="text" id="customerName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="customerPhone">Phone</label>
                    <input type="text" id="customerPhone" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Add Customer</button>
            </form>
        </div>
    </div>

    <!-- Record Payment Modal -->
    <div id="paymentModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Record Payment</h3>
                <span class="close">&times;</span>
            </div>
            <form id="paymentForm">
                <input type="hidden" id="paymentCustomerId">

                <div class="customer-info">
                    <p><strong>Customer:</strong> <span id="paymentCustomerName"></span></p>
                    <p><strong>Outstanding Balance:</strong> <span id="paymentCustomerBalance"></span></p>
                </div>

                <div class="form-group">
                    <label for="paymentAmount">Payment Amount (Rs.) *</label>
                    <input type="number" id="paymentAmount" class="form-control" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="paymentMethod">Payment Method *</label>
                    <select id="paymentMethod" class="form-control" required>
                        <option value="cash">Cash</option>
                        <option value="online">Online</option>
                    </select>
                </div>

                <div class="unpaid-bills-section">
                    <h4>Unpaid Bills</h4>
                    <div id="unpaidBillsList" class="unpaid-bills-list"></div>
                </div>

                <button type="submit" class="btn btn-success btn-block">Record Payment</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
