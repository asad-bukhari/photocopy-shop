<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Photocopy Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary btn-sm">← Back</button>
            <h1 class="navbar-brand">Inventory Management</h1>
            <div></div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Current Inventory</h2>
            <button id="addCategoryBtn" class="btn btn-secondary">+ Add Category</button>
        </div>

        <div class="inventory-list" id="inventoryList">
            <!-- Inventory items will be loaded here -->
        </div>

        <div class="floating-action">
            <button id="addItemBtn" class="btn btn-primary btn-large">+ Add Item</button>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="addItemModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Inventory Item</h3>
                <span class="close">&times;</span>
            </div>
            <form id="addItemForm">
                <div class="form-group">
                    <label for="itemName">Item Name *</label>
                    <input type="text" id="itemName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="itemCategory">Category *</label>
                    <select id="itemCategory" class="form-control" required>
                        <option value="">Select Category</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Printing">Printing Services</option>
                        <option value="Photocopying">Photocopying</option>
                        <option value="Services">Other Services</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="itemType">Type *</label>
                    <select id="itemType" class="form-control" required>
                        <option value="product">Physical Product</option>
                        <option value="service">Service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="itemPrice">Selling Price (Rs.) *</label>
                    <input type="number" id="itemPrice" class="form-control" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="itemCost">Purchase Price (Rs.)</label>
                    <input type="number" id="itemCost" class="form-control" step="0.01">
                </div>

                <div class="form-group">
                    <label for="itemStock">Current Stock Quantity</label>
                    <input type="number" id="itemStock" class="form-control" value="0">
                </div>

                <div class="form-group">
                    <label for="itemLowStock">Low Stock Alert Threshold</label>
                    <input type="number" id="itemLowStock" class="form-control" value="10">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Save Item</button>
            </form>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div id="addCategoryModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Custom Category</h3>
                <span class="close">&times;</span>
            </div>
            <form id="addCategoryForm">
                <div class="form-group">
                    <label for="categoryName">Category Name *</label>
                    <input type="text" id="categoryName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="categoryPricing">Pricing Scheme *</label>
                    <select id="categoryPricing" class="form-control" required>
                        <option value="fixed">Fixed Price (Per Item)</option>
                        <option value="per_page">Per Page</option>
                        <option value="per_quantity">Per Quantity</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Save Category</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
