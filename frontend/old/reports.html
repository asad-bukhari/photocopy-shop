<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Photocopy Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary btn-sm">← Back</button>
            <h1 class="navbar-brand">Reports</h1>
            <div></div>
        </div>
    </nav>

    <div class="container">
        <div class="report-section">
            <h2>Daily Summary</h2>

            <div class="date-filter">
                <label for="reportDate">Select Date:</label>
                <input type="date" id="reportDate" class="form-control">
            </div>

            <div class="report-summary">
                <div class="summary-card">
                    <h3>Total Sales</h3>
                    <p class="summary-value" id="reportTotalSales">Rs. 0.00</p>
                </div>

                <div class="summary-card">
                    <h3>Cash</h3>
                    <p class="summary-value" id="reportCash">Rs. 0.00</p>
                </div>

                <div class="summary-card">
                    <h3>Online</h3>
                    <p class="summary-value" id="reportOnline">Rs. 0.00</p>
                </div>

                <div class="summary-card summary-credit">
                    <h3>Credit Given</h3>
                    <p class="summary-value" id="reportCredit">Rs. 0.00</p>
                </div>

                <div class="summary-card">
                    <h3>Credit Payments Received</h3>
                    <p class="summary-value" id="reportCreditPayments">Rs. 0.00</p>
                </div>

                <div class="summary-card">
                    <h3>Bills Created</h3>
                    <p class="summary-value" id="reportBillsCount">0</p>
                </div>
            </div>

            <div class="report-actions">
                <button id="printReportBtn" class="btn btn-secondary">📄 Print Report</button>
                <button id="closeDayBtn" class="btn btn-danger">🔒 Close Day</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
